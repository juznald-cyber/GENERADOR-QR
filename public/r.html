<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#070c18" />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <title>Abriendo enlace...</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#070c18;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
      body{display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at top,#172554 0%,#070c18 60%)}
      .c{width:100%;max-width:400px;background:#131d33;border:1px solid rgba(148,163,184,.18);border-radius:20px;padding:30px 24px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
      .sp{width:38px;height:38px;border:3px solid rgba(56,189,248,.22);border-top-color:#38bdf8;border-radius:50%;margin:0 auto 16px;animation:s .7s linear infinite}
      @keyframes s{to{transform:rotate(360deg)}}
      h1{font-size:1.15rem;margin-bottom:8px;font-weight:700}
      p{font-size:.9rem;color:#94a3b8;line-height:1.5}
      a.btn{display:inline-block;margin-top:18px;width:100%;padding:12px 18px;border-radius:10px;background:linear-gradient(135deg,#38bdf8,#6366f1);color:#fff;font-weight:600;text-decoration:none;font-size:.92rem}
      .hide{display:none}
    </style>
  </head>
  <body>
    <div class="c" id="card">
      <div class="sp" id="sp"></div>
      <h1 id="t">Abriendo enlace...</h1>
      <p id="m">Conectando en un instante.</p>
      <a id="a" class="btn hide" rel="noopener noreferrer">Continuar al enlace</a>
    </div>
    <script>
      (function () {
        var PROJECT = 'generador-qr-96098';
        var BASE = 'https://firestore.googleapis.com/v1/projects/' + PROJECT + '/databases/(default)/documents';
        var t = document.getElementById('t');
        var m = document.getElementById('m');
        var sp = document.getElementById('sp');
        var a = document.getElementById('a');

        function show(title, msg, url) {
          if (sp && !url) sp.style.display = 'none';
          if (t) t.textContent = title;
          if (m) m.textContent = msg;
          if (a && url) {
            a.href = url;
            a.className = 'btn';
          }
        }

        var match = location.pathname.match(/\/r\/([a-zA-Z0-9_-]{3,40})\/?$/);
        var id = match ? match[1].toLowerCase() : (new URLSearchParams(location.search).get('r') || '').toLowerCase();

        if (!id || !/^[a-z0-9_-]{3,40}$/.test(id)) {
          show('Código QR no válido', 'El enlace escaneado no tiene un formato válido.');
          return;
        }

        var docUrl = BASE + '/qr_codes/' + encodeURIComponent(id);

        fetch(docUrl, { cache: 'no-store' })
          .then(function (res) {
            if (res.status === 404) {
              show('Código QR no disponible', 'Este código QR fue eliminado o ya no existe.');
              return null;
            }
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (doc) {
            if (!doc) return;
            var f = doc.fields || {};
            var active = f.active && f.active.booleanValue === true;
            var target = f.targetUrl && f.targetUrl.stringValue ? f.targetUrl.stringValue : '';
            var title = f.title && f.title.stringValue ? f.title.stringValue : 'enlace';

            if (!active) {
              show('Código QR pausado', 'Este enlace fue desactivado temporalmente por el administrador.');
              return;
            }

            if (!/^https?:\/\//i.test(target)) {
              show('Enlace no válido', 'El destino configurado no es una URL válida.');
              return;
            }

            // Fire atomic +1 scan increment in the background (non-blocking via keepalive)
            try {
              var payload = JSON.stringify({
                writes: [
                  {
                    transform: {
                      document: 'projects/' + PROJECT + '/databases/(default)/documents/qr_codes/' + id,
                      fieldTransforms: [
                        { fieldPath: 'scans', increment: { integerValue: '1' } },
                        { fieldPath: 'lastScannedAt', setToServerValue: 'REQUEST_TIME' }
                      ]
                    }
                  }
                ]
              });
              fetch(BASE + ':commit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: payload,
                keepalive: true
              }).catch(function () {});
            } catch (e) {}

            show('Abriendo ' + title, 'Redirigiendo...', target);
            location.replace(target);
          })
          .catch(function () {
            show('Error de conexión', 'No se pudo consultar el destino. Intenta escanear nuevamente.');
          });
      })();
    </script>
  </body>
</html>
